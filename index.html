<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marta & Emanuele</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header>
    <nav class="nav-menu">
      <a class="nav-link active" onclick="showSection('home')" id="nav-home"></a>
      <a class="nav-link" onclick="showSection('rsvp')" id="nav-rsvp"></a>
      <a class="nav-link" onclick="showSection('info')" id="nav-info"></a>
      <a class="nav-link" onclick="showSection('stay')" id="nav-stay"></a>
      <a class="nav-link" onclick="showSection('gifts')" id="nav-gifts"></a>
      <a class="nav-link" onclick="showSection('about')" id="nav-about"></a>
    </nav>
    <div class="lang">
      <button onclick="setLang('fr')" aria-label="French">🇫🇷</button>
      <button onclick="setLang('it')" aria-label="Italian">🇮🇹</button>
    </div>
  </header>

  <main>
    <section id="home">
      <div class="hero-bg"></div>
      <div class="section-inner section-center">
        <h1>Marta &amp; Emanuele</h1>
        <p id="subtitle" class="subtitle"></p>
      </div>
    </section>

    <section id="rsvp">
      <div class="section-inner section-center">
        <p id="rsvpEyebrow" class="eyebrow"></p>
        <h2 id="rsvpTitle"></h2>
        <p id="rsvpSub" class="body-lg"></p>
        <a id="rsvpLink" href="#" target="_blank" class="btn"></a>
      </div>
    </section>

    <section id="info">
      <div class="section-inner">
        <h2 id="infoTitle"></h2>
        <dl class="info-list">
          <div class="info-row">
            <dt id="churchLabel" class="eyebrow"></dt>
            <dd id="churchInfo"></dd>
            <dd id="churchTime"></dd>
            <dd><a id="churchMap" class="map-link" href="#" target="_blank" rel="noopener"></a></dd>
            <dd class="access-note" id="accessNote"></dd>
          </div>
          <div class="info-row">
            <dt id="venueLabel" class="eyebrow"></dt>
            <dd id="venueInfo"></dd>
            <dd><a id="venueMap" class="map-link" href="#" target="_blank" rel="noopener"></a></dd>
          </div>
        </dl>
      </div>
    </section>

    <section id="stay">
      <div class="section-inner stay-inner section-center">
        <h2 id="howToGet" class="stay-heading"></h2>
        <div id="travelRoutes" class="travel-routes"></div>
        <a id="trenordLink" class="trenord-link" href="https://www.trenord.it/" target="_blank" rel="noopener"></a>
      </div>
    </section>

    <section id="gifts">
      <div class="section-inner">
        <h2 id="giftsTitle"></h2>
        <p id="giftIntro" class="gift-intro"></p>
        <div class="gift-iban"></div>
        <div class="gift-carousel-wrap">
          <button class="carousel-arrow carousel-arrow--prev" id="giftPrev" aria-label="Previous">&#8249;</button>
          <button class="carousel-arrow carousel-arrow--next" id="giftNext" aria-label="Next">&#8250;</button>
          <div id="giftList" class="gift-carousel"></div>
          <div class="gift-carousel-overlay">
            <span class="swipe-hint" id="swipeHint">&#8592;&ensp;swipe&ensp;&#8594;</span>
            <div class="gift-carousel-dots" id="giftDots"></div>
          </div>
        </div>
      </div>
    </section>

    <section id="about">
      <div class="section-inner section-center">
        <h2 id="aboutTitle" class="title-nous"></h2>
        <p id="aboutSub" class="eyebrow-alt"></p>
        <p id="aboutText" class="body-lg"></p>
      </div>
    </section>
  </main>

  <footer></footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
